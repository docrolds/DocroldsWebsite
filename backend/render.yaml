services:
  - type: web
    name: docrolds-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: ***REDACTED-PASSWORD***
      - key: DATABASE_URL
        value: "postgresql://***REDACTED-DB-USER***:***REDACTED-DB-PASSWORD***@***REDACTED-DB-HOST***/docsbackendstorage"
    autoDeploy: true
